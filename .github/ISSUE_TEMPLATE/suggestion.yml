name: Suggest an improvement
description: An idea for a lesson, lab or the site itself.
title: "Suggestion: "
labels: ["enhancement"]
body:
  - type: input
    id: page
    attributes:
      label: Page (if it is about one page)
      placeholder: https://wangdiues.github.io/lulc-mapping-training/
  - type: textarea
    id: idea
    attributes:
      label: Your suggestion
      description: What would you change or add, and who would it help?
    validations:
      required: true
